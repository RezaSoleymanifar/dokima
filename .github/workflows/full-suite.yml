name: full suite
# Every test in the repo, on every pull request and on main.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  all-tests:
    name: all tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q pytest
      - run: pytest -q -p no:cacheprovider tests
