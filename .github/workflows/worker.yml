name: worker
run-name: "worker for #${{ github.event.issue.number }}${{ github.event.label.name != 'work' && format(' (label {0}, ignored)', github.event.label.name) || '' }}"
# Adding the `work` label to an issue approves its plan and starts the worker: a
# fresh GitHub machine builds what the plan asks and opens (or updates) the PR.
# Only a code owner's label counts. Removing the label stops a running build;
# adding it again builds again from the plan as it stands then.
on:
  issues:
    types: [labeled, unlabeled]
# Labeling or unlabeling `work` cancels the build already running for that issue.
# Other labels use their own group, so they never interrupt a build.
concurrency:
  group: work-${{ github.event.issue.number }}-${{ github.event.label.name }}
  cancel-in-progress: true
permissions:
  contents: read
  issues: read
jobs:
  work:
    outputs:
      workflows: ${{ steps.gate.outputs.workflows }}
    if: github.event.action == 'labeled' && github.event.label.name == 'work'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Only a code owner's label counts
        id: who
        env:
          SENDER: ${{ github.event.sender.login }}
        run: |
          if python3 -m dokima.plan approvers | tr ',' '\n' | grep -qx "$SENDER"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Not started::$SENDER added work, but only a code owner's label starts the worker."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - name: The plan as approved
        if: steps.who.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.event.issue.number }}
        run: python3 -m dokima.plan issue "$N" > /tmp/issue.md && cat /tmp/issue.md
      - name: Start from the issue's branch if it exists, else from main
        if: steps.who.outputs.ok == 'true'
        env:
          N: ${{ github.event.issue.number }}
        run: |
          if git ls-remote --exit-code --heads origin "work/issue-$N" >/dev/null; then
            git fetch -q origin "work/issue-$N" && git checkout -q -B "work/issue-$N" FETCH_HEAD
          else
            git checkout -q -b "work/issue-$N"
          fi
          echo "BUILD_BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Install pytest and Claude Code
        if: steps.who.outputs.ok == 'true'
        run: pip install pytest && npm install -g @anthropic-ai/claude-code
      - name: Worker (Claude Code)
        if: steps.who.outputs.ok == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude -p "$(cat dokima/roles/worker.md)

          The issue to build, as approved, is in /tmp/issue.md." \
            --dangerously-skip-permissions --max-turns 40
      - name: Tests pass before anything is pushed
        if: steps.who.outputs.ok == 'true'
        run: pytest -q
      # The app's token is minted only now, after the agent has finished, and it
      # cannot touch .github/ (the app has no workflows permission).
      - id: app
        if: steps.who.outputs.ok == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.DOKIMA_APP_ID }}
          private-key: ${{ secrets.DOKIMA_APP_KEY }}
      - name: Commit the build
        if: steps.who.outputs.ok == 'true'
        env:
          SLUG: ${{ steps.app.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          N: ${{ github.event.issue.number }}
        run: |
          BOT_ID=$(gh api "users/${SLUG}[bot]" --jq .id)
          git config user.name "${SLUG}[bot]"
          git config user.email "${BOT_ID}+${SLUG}[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build #$N"
      # A build that changes a workflow file is never pushed here: the bot cannot,
      # by design. It is handed to the approved job below instead.
      - name: Does the build change workflow files?
        id: gate
        if: steps.who.outputs.ok == 'true'
        run: |
          python3 -m dokima.gate touched "$BUILD_BASE" > /tmp/workflows.txt
          if [ -s /tmp/workflows.txt ]; then echo "workflows=true" >> "$GITHUB_OUTPUT"; else echo "workflows=false" >> "$GITHUB_OUTPUT"; fi
          cat /tmp/workflows.txt
      - name: Push and open the pull request
        if: steps.who.outputs.ok == 'true' && steps.gate.outputs.workflows == 'false'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          N: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
        run: |
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:work/issue-$N"
          if [ -z "$(gh pr list -R "$GITHUB_REPOSITORY" --head "work/issue-$N" --state open --json number --jq '.[].number')" ]; then
            gh pr create -R "$GITHUB_REPOSITORY" --head "work/issue-$N" --base main --title "$TITLE" --body "Closes #$N"
          fi
      - name: Hand the build to the approval step
        if: steps.who.outputs.ok == 'true' && steps.gate.outputs.workflows == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          N: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git bundle create /tmp/build.bundle "$BUILD_BASE..HEAD"
          python3 -m dokima.gate waiting "$N" "$RUN_URL" < /tmp/workflows.txt
      - name: Keep the build for the approval step
        if: steps.who.outputs.ok == 'true' && steps.gate.outputs.workflows == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: /tmp/build.bundle
          retention-days: 7

  # Runs only after the owner approves on GitHub (environment workflow-changes, owner
  # as required reviewer). The key that can push workflow files lives only here.
  push-workflow-changes:
    needs: work
    if: needs.work.outputs.workflows == 'true'
    environment: workflow-changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: build
          path: /tmp
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.DOKIMA_APP_ID }}
          private-key: ${{ secrets.DOKIMA_APP_KEY }}
      - name: Push the approved build and open the pull request
        env:
          PUSH_TOKEN: ${{ secrets.DOKIMA_WORKFLOW_TOKEN }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          N: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
        run: |
          git fetch -q /tmp/build.bundle "HEAD:refs/build"
          git push "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/build:refs/heads/work/issue-$N"
          if [ -z "$(gh pr list -R "$GITHUB_REPOSITORY" --head "work/issue-$N" --state open --json number --jq '.[].number')" ]; then
            gh pr create -R "$GITHUB_REPOSITORY" --head "work/issue-$N" --base main --title "$TITLE" --body "Closes #$N"
          fi

  workflow-change-stopped:
    needs: [work, push-workflow-changes]
    if: always() && needs.work.outputs.workflows == 'true' && needs.push-workflow-changes.result != 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.DOKIMA_APP_ID }}
          private-key: ${{ secrets.DOKIMA_APP_KEY }}
      - name: Say nothing was pushed
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          N: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 -m dokima.gate stopped "$N" "$RUN_URL"
