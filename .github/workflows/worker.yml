name: worker
# Labeling an issue `work` opens a draft PR for it, waits for Reza's approval,
# then runs Claude Code on a fresh GitHub machine to build what the issue asks.
on:
  issues:
    types: [labeled]
# One run per issue at a time; a second label waits, then sees the branch and stops.
concurrency:
  group: work-${{ github.event.issue.number }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  open:
    if: github.event.label.name == 'work'
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.start.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.DOKIMA_TOKEN }}
      - name: Open a draft pull request for the issue
        id: start
        env:
          GH_TOKEN: ${{ secrets.DOKIMA_TOKEN }}
          N: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
        run: |
          B="work/issue-$N"
          if git ls-remote --exit-code --heads origin "$B" >/dev/null; then
            echo "Issue #$N already has a worker branch; not starting a second run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "dokima-worker"
          git config user.email "dokima-worker@users.noreply.github.com"
          git checkout -b "$B"
          git commit --allow-empty -m "Start work on #$N"
          git push origin "$B"
          gh pr create --draft --head "$B" --base main --title "$TITLE" \
            --body "Closes #$N. Opened by the worker; no code is written until this is approved."
          echo "skip=false" >> "$GITHUB_OUTPUT"

  approve:
    needs: open
    if: needs.open.outputs.skip == 'false'
    runs-on: ubuntu-latest
    environment: approval
    steps:
      - run: echo "Approved by a required reviewer."

  build:
    needs: [open, approve]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/issue-${{ github.event.issue.number }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest and Claude Code
        run: pip install pytest && npm install -g @anthropic-ai/claude-code
      - name: Worker (Claude Code)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          N: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
        run: |
          printf 'Issue #%s: %s\n\n%s\n' "$N" "$TITLE" "$BODY" > /tmp/issue.md
          claude -p "$(cat dokima/roles/worker.md)

          The issue to build is issue number $N; its text is in /tmp/issue.md." \
            --dangerously-skip-permissions --max-turns 40
      - name: Tests pass before anything is pushed
        run: pytest -q
      - name: Commit, push and mark the pull request ready
        env:
          GH_TOKEN: ${{ secrets.DOKIMA_TOKEN }}
          N: ${{ github.event.issue.number }}
        run: |
          git config user.name "dokima-worker"
          git config user.email "dokima-worker@users.noreply.github.com"
          git add -A
          git commit -m "Build #$N"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:work/issue-$N"
          gh pr ready "work/issue-$N" -R "$GITHUB_REPOSITORY"
