name: worker
run-name: "worker for #${{ github.event.issue.number }}${{ github.event.label.name != 'work' && format(' (label {0}, ignored)', github.event.label.name) || '' }}"
# Adding the `work` label to an issue approves its plan and starts the worker: a
# fresh GitHub machine builds what the plan asks and opens (or updates) the PR.
# Only a code owner's label counts. Removing the label stops a running build;
# adding it again builds again from the plan as it stands then.
on:
  issues:
    types: [labeled, unlabeled]
# Labeling or unlabeling `work` cancels the build already running for that issue.
# Other labels use their own group, so they never interrupt a build.
concurrency:
  group: work-${{ github.event.issue.number }}-${{ github.event.label.name }}
  cancel-in-progress: true
permissions:
  contents: read
  issues: read
jobs:
  work:
    environment: keys
    if: github.event.action == 'labeled' && github.event.label.name == 'work'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # The app's budget before the run is read with a key made for this one call and revoked at once, so no bot key
      # stays live while the agent works.
      - id: budget-key
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.DOKIMA_APP_ID }}
          private-key: ${{ secrets.DOKIMA_APP_KEY }}
          skip-token-revoke: true
      - name: Read the API budget before the run
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.budget-key.outputs.token }}
        run: |
          python3 -m dokima.budget before app /tmp/budget.jsonl
          gh api -X DELETE installation/token --silent || echo "::warning title=Key not revoked::the budget's key could not be revoked"
      - name: Only a code owner's label counts
        id: who
        env:
          SENDER: ${{ github.event.sender.login }}
        run: |
          if python3 -m dokima.plan approvers | tr ',' '\n' | grep -qx "$SENDER"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Not started::$SENDER added work, but only a code owner's label starts the worker."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - name: The plan as approved
        if: steps.who.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.event.issue.number }}
        run: python3 -m dokima.plan issue "$N" > /tmp/issue.md && cat /tmp/issue.md
      - name: Start from the issue's branch if it exists, else from main
        if: steps.who.outputs.ok == 'true'
        env:
          N: ${{ github.event.issue.number }}
        run: |
          if git ls-remote --exit-code --heads origin "work/issue-$N" >/dev/null; then
            git fetch -q origin "work/issue-$N" && git checkout -q -B "work/issue-$N" FETCH_HEAD
            # Build on today's main, not on whatever main was when the branch began.
            git -c user.name=dokima -c user.email=dokima@users.noreply.github.com merge -q --no-edit origin/main
          else
            git checkout -q -b "work/issue-$N"
          fi
          echo "BUILD_BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Install pytest and Claude Code
        if: steps.who.outputs.ok == 'true'
        run: pip install pytest && npm install -g @anthropic-ai/claude-code
      - name: Worker (Claude Code)
        if: steps.who.outputs.ok == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude -p "$(cat dokima/roles/result-grade.md dokima/roles/worker.md)

          The issue to build, as approved, is in /tmp/issue.md." \
            --model claude-opus-5-5 --dangerously-skip-permissions --max-turns 40
      - name: Save the worker's full session log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-session-${{ github.event.issue.number }}-${{ github.run_attempt }}
          path: /home/runner/.claude/projects/
          if-no-files-found: ignore
          retention-days: 30
      # The judges run on fresh machines from what gets pushed. The fence decides what that is: the planner's tests
      # exactly as committed, and only in-scope changes. Nothing the worker did to this machine reaches them.
      - name: Fence - only in-scope changes, the planner's tests as committed
        if: steps.who.outputs.ok == 'true'
        run: |
          python3 -m dokima.fence "$BUILD_BASE" /tmp/issue.md > /tmp/dropped.txt
          if [ -s /tmp/dropped.txt ]; then
            echo "::warning title=Dropped by the fence::$(paste -sd, /tmp/dropped.txt)"
            { echo "## Dropped by the fence"; sed 's/^/- /' /tmp/dropped.txt; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Tests pass before anything is pushed
        if: steps.who.outputs.ok == 'true'
        run: pytest -q
      # The app's token is minted only now, after the agent has finished. Keys live in
      # the "keys" environment, which only main's reviewed workflows can open, so a
      # workflow edited inside a PR can never reach them before it is merged (#126).
      - id: app
        if: steps.who.outputs.ok == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.DOKIMA_APP_ID }}
          private-key: ${{ secrets.DOKIMA_APP_KEY }}
      - name: Commit the build
        if: steps.who.outputs.ok == 'true'
        env:
          SLUG: ${{ steps.app.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          N: ${{ github.event.issue.number }}
        run: |
          BOT_ID=$(gh api "users/${SLUG}[bot]" --jq .id)
          git config user.name "${SLUG}[bot]"
          git config user.email "${BOT_ID}+${SLUG}[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build #$N"
      - name: Push and open the pull request
        if: steps.who.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          N: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
        run: |
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:work/issue-$N"
          if [ -z "$(gh pr list -R "$GITHUB_REPOSITORY" --head "work/issue-$N" --state open --json number --jq '.[].number')" ]; then
            BODY="Closes #$N"
            [ -s /tmp/dropped.txt ] && BODY="$BODY

            **Dropped by the fence** (the worker changed these; they are outside the plan or are tests): $(paste -sd, /tmp/dropped.txt)"
            gh pr create -R "$GITHUB_REPOSITORY" --head "work/issue-$N" --base main --title "$TITLE" --body "$BODY"
          fi
      - name: Read the API budget after the run
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: python3 -m dokima.budget after app /tmp/budget.jsonl
      - name: Keep the API budget with the run
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: budget-${{ github.job }}
          path: /tmp/budget.jsonl
          if-no-files-found: warn
