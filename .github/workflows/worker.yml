name: worker
run-name: "worker for #${{ github.event.issue.number }}${{ github.event.label.name != 'work' && format(' (label {0}, ignored)', github.event.label.name) || '' }}"
# Labeling an issue `work` opens a draft PR for it. Nothing is built until Reza
# approves that PR with GitHub's own Approve button; see build.yml.
on:
  issues:
    types: [labeled]
# One run per issue at a time; a second label waits, then sees the branch and stops.
concurrency:
  group: work-${{ github.event.issue.number }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  open:
    if: github.event.label.name == 'work'
    runs-on: ubuntu-24.04
    outputs:
      skip: ${{ steps.start.outputs.skip }}
    steps:
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.DOKIMA_APP_ID }}
          private-key: ${{ secrets.DOKIMA_APP_KEY }}
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
      - name: Open a draft pull request for the issue
        id: start
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          N: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
        run: |
          B="work/issue-$N"
          if git ls-remote --exit-code --heads origin "$B" >/dev/null; then
            echo "Issue #$N already has a worker branch; not starting a second run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "dokima-runtime[bot]"
          git config user.email "337511017+dokima-runtime[bot]@users.noreply.github.com"
          git checkout -b "$B"
          git commit --allow-empty -m "Start work on #$N"
          git push origin "$B"
          gh pr create --draft --head "$B" --base main --title "$TITLE" \
            --body "Closes #$N. Opened by the worker. To start building, approve this PR (Review, then Approve). Nothing is written until then."
          echo "skip=false" >> "$GITHUB_OUTPUT"

