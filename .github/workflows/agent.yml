name: agent
run-name: "${{ inputs.role }}${{ inputs.role == 'reviewer' && format(' ({0})', inputs.stage) || '' }} for #${{ inputs.issue }}"
# Runs one agent on a fresh GitHub machine: the components of Dokima's flow, before the pipeline wires them.
# Everything the agent needs is gathered by code: the issue with every comment, and every earlier record in
# .dokima/N/ on try/issue-N. The agent runs its own deterministic check before it finishes; code runs it again,
# then writes this run's record (hand-back, check verdict, run, models) into .dokima/N/ and pushes it. Records never
# expire: they are the data the cards will be drawn from. Session logs stay on the run page.
on:
  workflow_dispatch:
    inputs:
      role:
        description: Which agent
        type: choice
        options: [planner, reviewer, worker]
      stage:
        description: For the reviewer, what it grades
        type: choice
        options: [plan, pr]
        default: plan
      issue:
        description: Issue number
        required: true
concurrency:
  group: agent-${{ inputs.issue }}
  cancel-in-progress: false
permissions:
  contents: read
  issues: read
  actions: read
jobs:
  run:
    environment: keys
    runs-on: ubuntu-24.04
    env:
      N: ${{ inputs.issue }}
      ROLE: ${{ inputs.role }}
      STAGE: ${{ inputs.role == 'reviewer' && inputs.stage || '' }}
      GH_TOKEN: ${{ github.token }}
      PACK: /tmp/pack
      OUT: /tmp/dokima-out
      MODEL: claude-opus-5-5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Only a code owner starts an agent
        env:
          SENDER: ${{ github.actor }}
        run: |
          python3 -m dokima.plan approvers | tr ',' '\n' | grep -qx "$SENDER" \
            || { echo "::error title=Not started::$SENDER is not a code owner."; exit 1; }
      - name: Starting branch
        run: |
          if git ls-remote --exit-code --heads origin "try/issue-$N" >/dev/null; then
            git fetch -q origin "try/issue-$N" && git checkout -q -B "try/issue-$N" FETCH_HEAD
            if [ "$ROLE" = worker ]; then
              git -c user.name=dokima -c user.email=dokima@users.noreply.github.com merge -q --no-edit origin/main
            fi
          elif [ "$ROLE" = planner ]; then
            git checkout -q -B "try/issue-$N" origin/main
          else
            echo "::error title=Nothing to $ROLE::try/issue-$N does not exist; run the planner first."; exit 1
          fi
          echo "BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Build the starting pack
        run: |
          python3 -m dokima.agent pack "$N" "$ROLE" "$STAGE" "$PACK" \
            || { echo "::error title=No plan::No passed plan in .dokima/$N yet, or (for the worker) no plan review approving the newest plan."; exit 1; }
          if [ "$STAGE" = pr ]; then git diff origin/main...HEAD -- . ':(exclude).dokima' > "$PACK/diff.patch"; fi
          ls -R "$PACK" | head -60
      - name: Install pytest and Claude Code
        run: pip install pytest && npm install -g @anthropic-ai/claude-code
      - name: All tests, run by code before the reviewer reads the pull request
        if: env.STAGE == 'pr'
        run: |
          python3 -m pytest -q -rA --junitxml="$PACK/tests.xml" > "$PACK/tests.txt" 2>&1 || true
          tail -5 "$PACK/tests.txt"
      - name: The agent (Claude Code)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PLANNER_BASE: ${{ env.BASE }}
        run: |
          mkdir -p "$OUT"
          case "$ROLE$STAGE" in
            planner)      GRADE=plan-grade;   CHECK="python3 -m dokima.planner check $N $OUT" ;;
            reviewerplan) GRADE=plan-grade;   CHECK="python3 -m dokima.agent check review $OUT/review.json" ;;
            reviewerpr)   GRADE=result-grade; CHECK="python3 -m dokima.agent check review $OUT/review.json" ;;
            worker)       GRADE=result-grade; CHECK="python3 -m dokima.agent check work $OUT/work.json" ;;
          esac
          echo "CHECK=$CHECK" >> "$GITHUB_ENV"
          claude -p "$(cat dokima/roles/$GRADE.md dokima/roles/$ROLE.md)

          # Your pack
          - $PACK/issue.md: issue #$N as it stands, with every comment (the owner's words and answers are here).
          - $PACK/in/: every earlier record of this issue, oldest first (NN-role.json). Each holds that run's hand-back,
            the code check's verdict and the run it came from. Answer open blockers by id from the newest review.
          - $PACK/plan.json: the newest plan that passed its check (absent until the planner has one).$( [ "$STAGE" = pr ] && echo "
          - $PACK/diff.patch: the work against main. $PACK/tests.txt and tests.xml: all tests, run by code on this machine.
          - $PACK/worker-run/: the worker's session log." )
          You are on branch try/issue-$N. Your stage is: ${STAGE:-$ROLE}.
          Hand back into $OUT. Before you finish, run this check on your hand-back and fix everything it reports:
            $CHECK" \
            --model "$MODEL" --dangerously-skip-permissions --max-turns 60
      - name: Code checks the hand-back
        if: always()
        run: |
          set +e; $CHECK > "$OUT/check.txt" 2>&1; rc=$?; set -e
          cat "$OUT/check.txt"
          echo "PASSED=$([ $rc = 0 ] && echo true || echo false)" >> "$GITHUB_ENV"
      - name: Fence - only in-scope changes, the planner's tests as committed
        if: env.ROLE == 'worker'
        run: |
          python3 -m dokima.fence "$BASE" "$PACK/plan.json" > "$OUT/dropped.txt"
          [ -s "$OUT/dropped.txt" ] && echo "::warning title=Dropped by the fence::$(paste -sd, "$OUT/dropped.txt")" || true
          git checkout -q "$BASE" -- .dokima 2>/dev/null || true
      - name: Write this run's record
        if: always()
        run: |
          REC=$(python3 -m dokima.agent record "$N" "$ROLE" "$STAGE" "$OUT" "$OUT/check.txt" "${PASSED:-false}" /home/runner/.claude/projects)
          echo "REC=$REC" >> "$GITHUB_ENV"
          { echo "## $REC"; echo '```json'; cat "$REC"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Save the hand-back and the full session log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.role }}-${{ inputs.issue }}
          path: |
            /tmp/dokima-out/
            /home/runner/.claude/projects/
          if-no-files-found: warn
          retention-days: 90
      # The app's token is minted only now, after the agent has finished.
      - id: app
        if: always() && env.REC != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.DOKIMA_APP_ID }}
          private-key: ${{ secrets.DOKIMA_APP_KEY }}
      - name: Push the record (and the planner's tests or the worker's code) to try/issue-N
        if: always() && env.REC != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          BOT_ID=$(gh api "users/${SLUG}[bot]" --jq .id)
          git config user.name "${SLUG}[bot]"
          git config user.email "${BOT_ID}+${SLUG}[bot]@users.noreply.github.com"
          git add "$REC"
          if [ "$PASSED" = true ] && [ "$ROLE" = planner ]; then git add tests; fi
          if [ "$PASSED" = true ] && [ "$ROLE" = worker ]; then git add -A -- . ':(exclude).dokima'; fi
          git commit -qm "$ROLE${STAGE:+ ($STAGE)} for #$N: record $(basename "$REC")"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:try/issue-$N"
      - name: Fail closed on a bad hand-back or the wrong model
        if: always()
        run: |
          python3 -c "import json,sys; r=json.load(open('$REC')); m=r.get('models') or []; bad=[x for x in m if x!='$MODEL']; sys.exit(print('models:', m) or (1 if bad or not m else 0))"
          [ "$PASSED" = true ] || { echo "::error title=Hand-back rejected::$(paste -sd'; ' "$OUT/check.txt")"; exit 1; }
