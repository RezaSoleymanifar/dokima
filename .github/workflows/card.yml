concurrency:
  group: >-
    ${{ github.event_name == 'push' && 'card-merged'
    || github.event_name == 'pull_request_target' && format('card-pr-{0}', github.event.pull_request.number)
    || github.event_name == 'issues' && (github.event.action == 'opened' || github.event.sender.type != 'Bot') && format('card-issue-{0}', github.event.issue.number)
    || github.event_name == 'workflow_run' && github.event.workflow_run.name == 'commands' && github.event.workflow_run.event == 'issue_comment' && format('card-idle-{0}', github.run_id)
    || github.event_name == 'workflow_run' && github.event.workflow_run.pull_requests[0].number && format('card-pr-{0}', github.event.workflow_run.pull_requests[0].number)
    || github.event_name == 'workflow_run' && format('card-run-{0}-{1}', github.event.workflow_run.head_sha, github.event.workflow_run.display_title)
    || format('card-idle-{0}', github.run_id) }}
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
  checks: read
  issues: read
  pull-requests: read
jobs:
  card:
    environment: keys
    # The bot's own edits and comments (the card itself) don't trigger another card, and a comment on a pull
    # request draws no issue card on it; an issue deleted or moved away has no card left to draw.
    if: github.event_name == 'workflow_run' || github.event_name == 'schedule' || (github.event_name == 'issues' && github.event.action == 'opened') || (github.event.sender.type != 'Bot' && !github.event.issue.pull_request && !(github.event_name == 'issues' && (github.event.action == 'deleted' || github.event.action == 'transferred')))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # The card is posted by the repo's Dokima app, so it shows as that app's bot.
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.DOKIMA_APP_ID }}
          private-key: ${{ secrets.DOKIMA_APP_KEY }}
      - name: Write the card
        # The commands run only for the owner's review of a PR; a merge only once it merged.
        if: >-
          github.event_name != 'push' &&
          (github.event_name != 'workflow_run' || github.event.workflow_run.name != 'commands' || github.event.workflow_run.event != 'issue_comment') &&
          (github.event_name != 'pull_request_target' || github.event.pull_request.merged)
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event_name == 'workflow_run' && github.event.workflow_run.pull_requests[0].number || '' }}
          RUN_TITLE: ${{ github.event.workflow_run.display_title }}
          DOKIMA_BOARD: ${{ vars.DOKIMA_BOARD }}
        run: python3 dokima/card.py
      - name: Redraw the stale cards of merged PRs
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
        run: python3 dokima/card.py merged
