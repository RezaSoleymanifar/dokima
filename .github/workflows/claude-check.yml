name: claude-check
on:
  pull_request:
permissions:
  contents: read
jobs:
  claude-check:
    runs-on: ubuntu-latest
    steps:
      - run: npm install -g @anthropic-ai/claude-code
      - name: Ask Claude to reply ok
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          reply=$(claude -p "Reply with exactly the word ok and nothing else.")
          echo "Claude replied: $reply"
          echo "$reply" | grep -qi '^ok'
