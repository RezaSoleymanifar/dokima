name: planner
run-name: "planner for #${{ github.event.issue.number }}${{ github.event.label.name != 'plan' && format(' (label {0}, ignored)', github.event.label.name) || '' }}"
# Adding the `plan` label to an issue starts the planner: a fresh GitHub machine
# reads the repo and the issue, and the planner hands back a plan with its tests,
# its questions for the owner listed inside it. Only a code owner's label counts. The planner
# holds no GitHub key: code checks what it handed back, and only then writes the
# plan into the issue and pushes the tests to work/issue-N.
on:
  issues:
    types: [labeled]
concurrency:
  group: plan-${{ github.event.issue.number }}-${{ github.event.label.name }}
  cancel-in-progress: true
permissions:
  contents: read
  issues: read
jobs:
  plan:
    environment: keys
    if: github.event.label.name == 'plan'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Only a code owner's label counts
        id: who
        env:
          SENDER: ${{ github.event.sender.login }}
        run: |
          if python3 -m dokima.plan approvers | tr ',' '\n' | grep -qx "$SENDER"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Not started::$SENDER added plan, but only a code owner's label starts the planner."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - name: The issue as it stands
        if: steps.who.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.event.issue.number }}
        run: |
          gh issue view "$N" -R "$GITHUB_REPOSITORY" --json number,title,body -q '"Issue #\(.number): \(.title)\n\n\(.body)"' > /tmp/issue.md
          cat /tmp/issue.md
      - name: Start from the issue's branch if it exists, else from main
        if: steps.who.outputs.ok == 'true'
        env:
          N: ${{ github.event.issue.number }}
        run: |
          if git ls-remote --exit-code --heads origin "work/issue-$N" >/dev/null; then
            git fetch -q origin "work/issue-$N" && git checkout -q -B "work/issue-$N" FETCH_HEAD
          else
            git checkout -q -b "work/issue-$N"
          fi
          echo "PLANNER_BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Install pytest and Claude Code
        if: steps.who.outputs.ok == 'true'
        run: pip install pytest && npm install -g @anthropic-ai/claude-code
      - name: Planner (Claude Code)
        if: steps.who.outputs.ok == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          N: ${{ github.event.issue.number }}
        run: |
          mkdir -p /tmp/dokima-out
          claude -p "$(cat dokima/roles/plan-grade.md dokima/roles/planner.md)

          The issue to plan is in /tmp/issue.md; its number N is $N. Hand back into /tmp/dokima-out." \
            --model claude-opus-5-5 --dangerously-skip-permissions --max-turns 40
      - name: Save the planner's full session log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: planner-session-${{ github.event.issue.number }}-${{ github.run_attempt }}
          path: /home/runner/.claude/projects/
          if-no-files-found: ignore
          retention-days: 30
      - name: Show what the planner handed back
        if: always()
        run: |
          echo "## What the planner handed back" >> "$GITHUB_STEP_SUMMARY"
          for f in /tmp/dokima-out/plan.json; do
            [ -f "$f" ] && { echo "**$(basename "$f")**"; echo '```'; cat "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done
          true
      - name: Check what the planner handed back
        if: steps.who.outputs.ok == 'true'
        run: python3 -m dokima.planner check "${{ github.event.issue.number }}" /tmp/dokima-out
      # The app's token is minted only now, after the planner has finished. It writes
      # the plan only when the check passed, and otherwise only says why it failed.
      - id: app
        if: always() && steps.who.outputs.ok == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.DOKIMA_APP_ID }}
          private-key: ${{ secrets.DOKIMA_APP_KEY }}
      - name: Push the tests
        if: success() && steps.who.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
          N: ${{ github.event.issue.number }}
        run: |
          [ -f /tmp/dokima-out/plan.json ] || exit 0
          BOT_ID=$(gh api "users/${SLUG}[bot]" --jq .id)
          git config user.name "${SLUG}[bot]"
          git config user.email "${BOT_ID}+${SLUG}[bot]@users.noreply.github.com"
          git add tests
          git commit -m "Tests for #$N"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:work/issue-$N"
      - name: Write the plan into the issue, or post the question
        if: success() && steps.who.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: python3 -m dokima.planner post "${{ github.event.issue.number }}" /tmp/dokima-out
      - name: Say on the issue why the plan was rejected
        if: failure() && steps.who.outputs.ok == 'true' && steps.app.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: python3 -m dokima.planner rejected "${{ github.event.issue.number }}" /tmp/dokima-out
