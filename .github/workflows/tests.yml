name: tests
# DEMO: one GitHub check per done-when, plus one final gate check.
on:
  pull_request:
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  done-whens:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - id: m
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/done_whens.py >> "$GITHUB_OUTPUT"

  check:
    needs: done-whens
    if: needs.done-whens.outputs.matrix != '[]'
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.done-whens.outputs.matrix) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q pytest
      - name: Run this done-when's tests
        env:
          TESTS: ${{ matrix.tests }}
          ID: ${{ matrix.id }}
        run: |
          if [ -z "$TESTS" ]; then echo "::error title=${ID} has no test::No test verifies this done-when yet."; exit 1; fi
          pytest -rA -p no:cacheprovider -o junit_family=xunit1 --junitxml=r.xml $TESTS
      - name: Annotate the tests that ran
        if: always() && matrix.tests != ''
        env:
          ID: ${{ matrix.id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import os, xml.etree.ElementTree as ET
          repo, sha, done_when = os.environ["GITHUB_REPOSITORY"], os.environ["HEAD_SHA"], os.environ["ID"]
          for tc in ET.parse("r.xml").iter("testcase"):
              failed = any(c.tag in ("failure", "error") for c in tc)
              kind, verdict = ("error", "failed") if failed else ("notice", "passed")
              path, line = tc.get("file"), int(tc.get("line")) + 1
              link = f"https://github.com/{repo}/blob/{sha}/{path}#L{line}"
              print(f"::{kind} file={path},line={line},title={done_when} {verdict}::"
                    f"{tc.get('name')} {verdict} · {path} line {line} · view the test: {link}")
          PY

  all-done-whens:
    name: all done-whens passed
    needs: check
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: test "${{ needs.check.result }}" = "success"
