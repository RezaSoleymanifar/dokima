name: tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: pytest -q -rA -o junit_family=xunit1 --junitxml=results/results.xml
      - name: Save results for the card
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: results/results.xml
