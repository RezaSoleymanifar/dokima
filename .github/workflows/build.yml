name: build
run-name: "build for ${{ github.event.pull_request.head.ref }}"
# An approver's Approve on a worker PR that has no work yet starts the build.
# Approvers are the code owners in CODEOWNERS. Nobody else's approval counts, the
# bot's included, and later approvals (for merging) start nothing. The worker
# reads the plan as it stood when it was approved.
on:
  pull_request_review:
    types: [submitted]
concurrency:
  group: work-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  build:
    if: github.event.review.state == 'approved' && startsWith(github.event.pull_request.head.ref, 'work/issue-')
    runs-on: ubuntu-24.04
    steps:
      # First decide, with main's code and no secrets: does this approval start a build?
      - uses: actions/checkout@v5
        with:
          ref: main
          path: _main
          persist-credentials: false
      - id: decide
        working-directory: _main
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ github.event.review.state }}
          REVIEWER: ${{ github.event.review.user.login }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          COMMITS=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .commits)
          python3 -m dokima.plan starts "$STATE" "$REVIEWER" "$BRANCH" "$COMMITS" | tee -a "$GITHUB_OUTPUT"
          # Remove main's copy so nothing from it can end up in the worker's commit.
          cd .. && rm -rf _main
      - uses: actions/checkout@v5
        if: steps.decide.outputs.start == 'true'
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        if: steps.decide.outputs.start == 'true'
        with:
          python-version: "3.12"
      - name: The plan as approved
        if: steps.decide.outputs.start == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: python3 -m dokima.plan issue "$PR" > /tmp/issue.md && cat /tmp/issue.md
      - name: Install pytest and Claude Code
        if: steps.decide.outputs.start == 'true'
        run: pip install pytest && npm install -g @anthropic-ai/claude-code
      - name: Worker (Claude Code)
        if: steps.decide.outputs.start == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude -p "$(cat dokima/roles/worker.md)

          The issue to build, as approved, is in /tmp/issue.md." \
            --dangerously-skip-permissions --max-turns 40
      - name: Tests pass before anything is pushed
        if: steps.decide.outputs.start == 'true'
        run: pytest -q
      # The app's token is minted only now, after the agent has finished, and it
      # cannot touch .github/ (the app has no workflows permission).
      - id: app
        if: steps.decide.outputs.start == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.DOKIMA_APP_ID }}
          private-key: ${{ secrets.DOKIMA_APP_KEY }}
      - name: Commit, push and mark the pull request ready
        if: steps.decide.outputs.start == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          N="${BRANCH#work/issue-}"
          BOT_ID=$(gh api "users/${SLUG}[bot]" --jq .id)
          git config user.name "${SLUG}[bot]"
          git config user.email "${BOT_ID}+${SLUG}[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build #$N"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:$BRANCH"
          gh pr ready "$BRANCH" -R "$GITHUB_REPOSITORY"
