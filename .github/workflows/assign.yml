name: assign
# Every new issue is assigned to the repo's approvers (the code owners), so it
# shows up in their own GitHub views, on the web and in the mobile app.
on:
  issues:
    types: [opened]
permissions:
  contents: read
jobs:
  assign:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.DOKIMA_APP_ID }}
          private-key: ${{ secrets.DOKIMA_APP_KEY }}
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          N: ${{ github.event.issue.number }}
        run: gh issue edit "$N" -R "$GITHUB_REPOSITORY" --add-assignee "$(python3 -m dokima.plan approvers)"
