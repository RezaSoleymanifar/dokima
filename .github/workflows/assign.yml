name: assign
# Assigns every new issue to the repo's code owners, so it shows up in their
# GitHub. Bot-opened issues too: no bot filter here. Names come from CODEOWNERS.
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  assign:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Read the API budget before the run
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m dokima.budget before github-token /tmp/budget.jsonl
      - name: Assign the code owners
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue edit "$ISSUE_NUMBER" -R "$REPO" --add-assignee "$(python3 -m dokima.plan approvers)"
      - name: Read the API budget after the run
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m dokima.budget after github-token /tmp/budget.jsonl
      - name: Keep the API budget with the run
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: budget-${{ github.job }}
          path: /tmp/budget.jsonl
          if-no-files-found: warn
