name: uptodate
# After every merge to main, calls GitHub's Update branch for each open PR that fell behind,
# with the Dokima app's token so the PR's checks run again. A PR that clashes leaves a record on its issue and starts
# its planner, or mentions the code owners on a PR Dokima didn't build. Rules live in dokima/uptodate.py.
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: uptodate
  cancel-in-progress: false
jobs:
  update:
    environment: keys
    runs-on: ubuntu-24.04
    steps:
      # The whole history, so a clash's trial merge finds the files that clashed.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.DOKIMA_APP_ID }}
          private-key: ${{ secrets.DOKIMA_APP_KEY }}
      - name: Read the API budget before the run
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: python3 -m dokima.budget before app /tmp/budget.jsonl
      - name: Update open PRs behind main
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: python3 -m dokima.uptodate
      - name: Read the API budget after the run
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: python3 -m dokima.budget after app /tmp/budget.jsonl
      - name: Keep the API budget with the run
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: budget-${{ github.job }}
          path: /tmp/budget.jsonl
          if-no-files-found: warn
